services:
  app:
    image: vahkjsdf/grion-server:${IMAGE_TAG:-latest}
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://${DB_HOST:?DB_HOST is required}:3306/grion_db?serverTimezone=Asia/Seoul
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      DEEPL_API_KEY: ${DEEPL_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      FAL_API_KEY: ${FAL_API_KEY}
      FRONTEND_PROD_ORIGIN: ${FRONTEND_PROD_ORIGIN}
    restart: unless-stopped
