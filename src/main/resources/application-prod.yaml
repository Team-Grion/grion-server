spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
deepl:
  api:
    key: ${DEEPL_API_KEY}
openai:
  api:
    key: ${OPENAI_API_KEY}
fal:
  api:
    key: ${FAL_API_KEY}
jwt:
  secret: ${JWT_SECRET}
cors:
  allowed-origins:
    - ${FRONTEND_PROD_ORIGIN}
    - http://localhost:3000
